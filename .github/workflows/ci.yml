name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tipos, testes unitários e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  e2e:
    name: E2E (Chromium + VR emulado)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: test
    # Informativo: renderiza WebGL por software (lento em runners pequenos), então um estouro de tempo
    # não deve bloquear o merge. Remova a linha abaixo para torná-lo obrigatório.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results
